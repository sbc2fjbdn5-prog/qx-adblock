#!name=百度地图开屏广告
#!desc=基于百度地图 iOS 21.18.0 实机核对；改写 AFD 与地图专用开屏响应，避免直接拒绝后残留白屏倒计时
#!author=sbc2fjbdn5-prog
#!homepage=https://github.com/sbc2fjbdn5-prog/qx-adblock
#!version=1.0.0

# 百度 AFD 开屏：保留接口结构，仅清空广告数组。
^https:\/\/afd\.baidu\.com\/afd\/entry(?:\?|$) url script-response-body https://raw.githubusercontent.com/sbc2fjbdn5-prog/qx-adblock/refs/heads/main/custom_sources/scripts/BaiduAFD.js

# 百度地图专用开屏：改写 Protobuf 响应，使 banner/splash 条目过期。
^https:\/\/newclient\.map\.baidu\.com\/client\/phpui2\/\?qt=ads(?:&|$) url script-response-body https://raw.githubusercontent.com/sbc2fjbdn5-prog/qx-adblock/refs/heads/main/custom_sources/scripts/BaiduMap.js

# 只处理广告接口；保留地图、定位、导航及路线规划请求。
hostname = afd.baidu.com, newclient.map.baidu.com
