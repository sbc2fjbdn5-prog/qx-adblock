#!name=锤子便签开屏广告
#!desc=基于锤子便签 iOS 4.2.9 实机抓包，拦截美数 AdMate/1RTB 开屏及广告 SDK 回退请求
#!author=sbc2fjbdn5-prog
#!homepage=https://github.com/sbc2fjbdn5-prog/qx-adblock
#!version=1.0.0

# 美数 AdMate/1RTB：实机命中 app_id=111294、pid=1051437、accept_ad_type=4。
^https?:\/\/(?:zl)?sdk\.1rtb\.net\/sdk\/(?:req_ad|config)(?:\?|$) url reject-dict
^https?:\/\/sdk-report\.1rtb\.com\/reports(?:\?|$) url reject

# 穿山甲广告回退及素材。
^https?:\/\/api-access\.pangolin-sdk-toutiao(?:1|-b)?\.com\/.* url reject-dict
^https?:\/\/(?:sf3|sf6)-fe-tos\.pglstatp-toutiao\.com\/.* url reject
^https?:\/\/p3-(?:be-pack-sign\.pglstatp-toutiao|stone-tv\.byteimg)\.com\/.* url reject
^https?:\/\/(?:dm(?:-hl)?\.toutiao|dm\.bytedance)\.com\/.* url reject

# 优量汇/GDT、京东及其他广告 SDK 回退。
^https?:\/\/mi\.gdt\.qq\.com\/gdt_mview\.fcg(?:\?|$) url reject-dict
^https?:\/\/(?:sdk\.e|win\.gdt)\.qq\.com\/.* url reject
^https?:\/\/im-x\.jd\.com\/.* url reject
^https?:\/\/open\.e\.kuaishou\.com\/rest\/e\/.* url reject-dict
^https?:\/\/adservice\.sigmob\.cn\/.* url reject-dict
^https?:\/\/mobads\.baidu\.com\/.* url reject

# 只列广告域名；不拦截锤子便签同步、登录及云服务域名。
hostname = sdk.1rtb.net, zlsdk.1rtb.net, sdk-report.1rtb.com, api-access.pangolin-sdk-toutiao.com, api-access.pangolin-sdk-toutiao1.com, api-access.pangolin-sdk-toutiao-b.com, sf3-fe-tos.pglstatp-toutiao.com, sf6-fe-tos.pglstatp-toutiao.com, p3-be-pack-sign.pglstatp-toutiao.com, p3-stone-tv.byteimg.com, dm.toutiao.com, dm-hl.toutiao.com, dm.bytedance.com, mi.gdt.qq.com, sdk.e.qq.com, win.gdt.qq.com, im-x.jd.com, open.e.kuaishou.com, adservice.sigmob.cn, mobads.baidu.com
