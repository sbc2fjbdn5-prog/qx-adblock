#!name=中国移动山西开屏广告
#!desc=兼容山西地区可能使用的新旧中国移动接口，去除开屏、探索页及情绪市场广告
#!author=sbc2fjbdn5-prog
#!homepage=https://github.com/sbc2fjbdn5-prog/qx-adblock

# 山西地区可能仍使用 clientaccess.10086.cn，通用规则通常只覆盖 client.app.coc.10086.cn。
^https?:\/\/(clientaccess|client\.app\.coc)\.10086\.cn\/biz-orange\/DN\/init\/startInit url reject-200
^https?:\/\/(clientaccess|client\.app\.coc)\.10086\.cn\/biz-orange\/DN\/explorePage\/getAdverList url reject-200
^https?:\/\/(clientaccess|client\.app\.coc|h\.app\.coc|app)\.10086\.cn\/biz-orange\/DN\/emotionMarket url reject-200

hostname = clientaccess.10086.cn, client.app.coc.10086.cn, h.app.coc.10086.cn, app.10086.cn
